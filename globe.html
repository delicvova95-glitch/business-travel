<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Глобус</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #060a1c; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #94a3b8; font: 14px system-ui, sans-serif; pointer-events: none; transition: opacity .3s;
  }
  #hint {
    position: fixed; right: 16px; bottom: 16px;
    color: #64748b; font: 12px/1.5 system-ui, sans-serif; text-align: right;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">Загрузка глобуса…</div>
<div id="hint">Вращение — ЛКМ · Зум — колесо</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

const RADIUS = 2;

const app = document.getElementById('app');
const loadingEl = document.getElementById('loading');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, RADIUS * 3.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 12;
controls.rotateSpeed = 0.4;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.enableDamping = true;
controls.dampingFactor = 0.1;

// Свет
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(RADIUS * 5, RADIUS * 2, RADIUS * 5);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x88ccff, 0.5);
fillLight.position.set(-RADIUS * 3, RADIUS, -RADIUS * 2);
scene.add(fillLight);

// Глобус
const texLoader = new THREE.TextureLoader();
const globeMaterial = new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0.0 });

texLoader.load('assets/earth.png', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 16;
  globeMaterial.map = tex;
  globeMaterial.color.set(0xffffff);
  globeMaterial.needsUpdate = true;
  loadingEl.style.opacity = '0';
}, undefined, () => {
  loadingEl.textContent = 'Не удалось загрузить assets/earth.png';
});

const globeGeometry = new THREE.SphereGeometry(RADIUS, 64, 64);
const globe = new THREE.Mesh(globeGeometry, globeMaterial);
globe.rotation.y = 2.2;
scene.add(globe);

// Атмосфера (свечение по краю)
const atmosphereMaterial = new THREE.ShaderMaterial({
  uniforms: {
    atmosphereColor: { value: new THREE.Color('#4da6ff') },
    intensity: { value: 0.6 },
    fresnelPower: { value: 3.0 },
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 atmosphereColor;
    uniform float intensity;
    uniform float fresnelPower;
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      float fresnel = pow(1.0 - abs(dot(vNormal, normalize(-vPosition))), fresnelPower);
      gl_FragColor = vec4(atmosphereColor, fresnel * intensity);
    }
  `,
  side: THREE.BackSide,
  transparent: true,
  depthWrite: false,
});
const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 64, 32), atmosphereMaterial);
atmosphere.scale.setScalar(1.15);
scene.add(atmosphere);

// Цикл рендера
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
