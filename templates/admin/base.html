<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{{ meta_title or "Панель управления — Business Travel" }}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">
<header class="admin-header">
  <div class="container admin-header-inner">
    <a href="{{ url_for('admin.dashboard') }}" class="logo logo-light">
      <span class="logo-text">Business <em>Travel</em> · Панель</span>
    </a>
    {% if session.get('admin_id') %}
    <nav class="admin-nav">
      <a href="{{ url_for('admin.dashboard') }}">Обзор</a>
      <a href="{{ url_for('admin.requests_list') }}">Заявки</a>
      <a href="{{ url_for('admin.tours_list') }}">Туры</a>
      <a href="{{ url_for('admin.destinations_list') }}">Направления</a>
      <a href="{{ url_for('admin.settings_page') }}">Настройки</a>
      <a href="{{ url_for('index') }}" target="_blank">Сайт ↗</a>
      <form method="post" action="{{ url_for('admin.logout') }}" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-ghost btn-sm">Выйти</button>
      </form>
    </nav>
    {% endif %}
  </div>
</header>
<main class="admin-main">
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</main>
</body>
</html>
